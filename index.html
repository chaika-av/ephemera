/* Послания: [текст, мелкая подпись снизу (необязательно)]. \n — перенос строки, остальное переносится само */
var MSGS=[
 ["медленное время художественного опыта"],
 ["в режиме перемотки"],
 ["между кадрами"],

var bag=[],cur=-1,curM=null,layoutSeed=0;

/* Тексты из Google Таблицы: Файл → Поделиться → Опубликовать в Интернете → лист, формат CSV → вставить ссылку сюда.
   Колонка A — послание (перенос строки внутри ячейки — Alt+Enter / Ctrl+Enter), колонка B — мелкая подпись (необязательно).

var SHEET_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vSM7Ttrfv1tRJs0IKbQLQGpFGHVzskIZC9d3oroLj2fHM2nzAJ_U5prLdIwAJCOFQFn5MUzBMnniuqi/pub?gid=732138107&single=true&output=csv";
function parseCSV(t){

  if(q){if(c==='"'){if(t.charAt(i+1)==='"'){f+='"';i++}else q=false}else f+=c}
  else if(c==='"')q=true;
  else if(c===','){row.push(f);f=''}
  else if(c==='\n'||c==='\r'){if(c==='\r'&&t.charAt(i+1)==='\n')i++;row.push(f);rows.push(row);row=[];f=''}
  else f+=c;
 }
 if(f!==''||row.length){row.push(f);rows.push(row)}

}
function rowsToMsgs(rows){

  if(!a||a.slice(0,2)==='//')return;
  out.push(b?[a,b]:[a]);
 });

}
function useMsgs(list){

}
function loadSheet(){

 if(!u)return;

  var list=rowsToMsgs(parseCSV(t));
  if(!list.length)return;
  try{localStorage.setItem(key,JSON.stringify(list))}catch(e){}

function customItems(cw,ch){

  return u;
 }

  us.forEach(function(t){var c=line?line+' '+t:t;if(line&&mc.measureText(c).width>maxW){out.push(line);line=t}else line=c});
  out.push(line);

   while(k>0&&isFW(ws[k-1]))k--;

   if(mc.measureText(mg).width>maxW)continue;

  var n=ls.length,i,lw=0;
  for(i=0;i<n-1;i++){var ws=ls[i].split(' ');if(isFW(ws[ws.length-1]))return 1}
  if(n>1&&ls[n-1].indexOf(' ')<0){
   ls.forEach(function(l){lw=Math.max(lw,mc.measureText(l).width)});
   if(mc.measureText(ls[n-1]).width<.75*lw)return 2;
  }

 }

 function wrap(f,maxW,maxAll){
  var out=[],lw=0,bd=false;mc.font=f+fam;
  paras.forEach(function(p){
   var us=units(p),ls=fit(us,maxW),wd,t;
   if(bad(ls))for(wd=maxW*1.04;wd<=maxAll;wd*=1.04){t=fit(us,wd);if(!bad(t)){ls=t;break}}
   if(ls.length>1){
    var lo=0,hi=maxW,k,badLs=bad(ls);
    us.forEach(function(u){lo=Math.max(lo,mc.measureText(u).width)});
    if(wd>hi)hi=wd;
    for(k=0;k<14&&hi-lo>1;k++){var mid=(lo+hi)/2;t=fit(us,mid);if(t.length===ls.length&&(badLs||!bad(t)))hi=mid;else lo=mid}
    ls=fit(us,hi);
   }
   if(bad(ls)===1)bd=true;
   ls.forEach(function(l){out.push(l)});
  });
  out.forEach(function(l){lw=Math.max(lw,mc.measureText(l).width)});
  return {lines:out,w:lw,bad:bd};
 }
 for(it=0;it<50;it++){
  var r=wrap(f,aw*wf,aw);L=r.lines;w=r.w;
  h=L.length*f*LH;
  if(sign){mc.font=(f*.62)+fam;w=Math.max(w,mc.measureText(sign).width);h+=f*.3+f*.62*LH}
  if(w<=aw&&h<=ah&&(!r.bad||it>=4))break;
  f*=.92;
 }
 var x=mx+px*Math.max(0,aw-w),y=my+py*Math.max(0,ah-h),out=[];
 L.forEach(function(l){out.push({t:l,x:x/cw,y:(y+f*.85)/ch,f:f,font:'mono'});y+=f*LH});
 if(sign){y+=f*.3;out.push({t:sign,x:x/cw,y:(y+f*.62*.85)/ch,f:f*.62,font:'mono'})}
 return out;
}
function buildText0(){

}

function resize(){
 dpr=Math.min(window.devicePixelRatio||1,2);

 gw=Math.ceil(innerWidth/S);gh=Math.ceil(innerHeight/S);
 acc=new Float32Array(gw*gh);nA=mkNoise(gw,gh,[8,16,32],[.5,.3,.2]);nB=mkNoise(gw,gh,[14,28],[.6,.4]);

 if(demo)startDemo();
}

function stamp(x,y,k,sig,mx){
 var sg=(sig||SIGMA)/S,cx=x/S,cy=y/S,r=Math.ceil(sg*2.6),inv=1/(2*sg*sg);
 var x0=Math.max(0,Math.floor(cx-r)),x1=Math.min(gw-1,Math.ceil(cx+r)),y0=Math.max(0,Math.floor(cy-r)),y1=Math.min(gh-1,Math.ceil(cy+r));
 for(var j=y0;j<=y1;j++)for(var i=x0;i<=x1;i++){
  var dx=i-cx,dy=j-cy,id=j*gw+i,v=k*Math.exp(-(dx*dx+dy*dy)*inv)*(1+.13*(nA[id]*2-1));
  acc[id]=mx?Math.max(acc[id],v):Math.max(0,Math.min(1.15,acc[id]+v));
 }
 active=true;
}
function stroke(x,y){
 if(!last){stamp(x,y,.7);last={x:x,y:y};return}
 var dx=x-last.x,dy=y-last.y,d=Math.hypot(dx,dy),st=SIGMA*.35,n=Math.max(1,Math.ceil(d/st));
 for(var i=1;i<=n;i++)stamp(last.x+dx*i/n,last.y+dy*i/n,.32);
 
 last={x:x,y:y};
}

function sm(a,b,x){var t=(x-a)/(b-a);t=t<0?0:t>1?1:t;return t*t*(3-2*t)}


var nA,nB;
function mkNoise(w,h,sc,wt){
 var out=new Float32Array(w*h);
 for(var s=0;s<sc.length;s++){
  var c=sc[s],lw=Math.ceil(w/c)+2,lh=Math.ceil(h/c)+2,L=new Float32Array(lw*lh);
  for(var k=0;k<L.length;k++)L[k]=Math.random();
  for(var y=0;y<h;y++){var fy=y/c,iy=Math.floor(fy),ty=fy-iy;ty=ty*ty*(3-2*ty);
   for(var x=0;x<w;x++){var fx=x/c,ix=Math.floor(fx),tx=fx-ix;tx=tx*tx*(3-2*tx);
    var a=L[iy*lw+ix],b=L[iy*lw+ix+1],c2=L[(iy+1)*lw+ix],d=L[(iy+1)*lw+ix+1];
    var top=a+(b-a)*tx,bot=c2+(d-c2)*tx;
    out[y*w+x]+=wt[s]*(top+(bot-top)*ty);
   }}
 }
 for(var i=0;i<out.length;i++){var v=.5+(out[i]-.5)*2.4;out[i]=v<0?0:v>1?1:v}
 return out;
}
